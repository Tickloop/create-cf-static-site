# Pull requests get a preview URL comment; every push to main deploys production.
name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a PR replaces its in-flight preview. Production queues
# instead, so the newest commit always ends up live.
concurrency:
  group: deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CF_SEND_TELEMETRY: "false"
      # Fork and Dependabot PRs get no secrets, so they're built and checked only.
      CAN_PREVIEW: ${{ github.event_name == 'pull_request' && secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make install test

      - name: Deploy production
        if: github.event_name != 'pull_request'
        run: make deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy preview
        if: env.CAN_PREVIEW == 'true'
        run: make preview PREVIEW_NAME=pr-${{ github.event.pull_request.number }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # One comment per PR, edited in place on every push.
      - name: Comment preview URL
        if: env.CAN_PREVIEW == 'true'
        run: gh pr comment "$PR" --edit-last --create-if-none --body "**Preview:** $(make -s preview-url) (commit ${SHA::7})"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}

      - name: Build only
        if: github.event_name == 'pull_request' && env.CAN_PREVIEW != 'true'
        run: make build
