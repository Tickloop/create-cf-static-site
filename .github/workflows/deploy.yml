# Every push to main is built, checked, and deployed to production.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time; queue rather than cancel, so the newest
# commit always ends up live.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.url.outputs.url }}
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: make deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - id: url
        name: Production URL
        run: |
          domain="$(node -p "require('./site.json').domain")"
          if [ -n "$domain" ]; then echo "url=https://$domain" >> "$GITHUB_OUTPUT"; fi
